# Epsilook CI — the same checks tools/check.py runs locally, run again on push.
#
# It deliberately does NOT deploy, and it does not gate the deploy either:
# .github/workflows/pages.yml publishes on the same push, in parallel, so by
# the time a check here fails the site is already live. That is the standing
# choice - CLAUDE.md, "CI is an alarm, no git hook". What it buys is mail
# within a minute saying the push you just made shipped new markup against a
# cached stylesheet, or a pack the manifest disagrees with. That is the class
# of failure this repo actually has: silent, invisible on the developer's
# machine because their own browser holds the new files.
#
# The checks live in tools/check.py, not in this file, so there is exactly one
# definition of "does this repo pass" and it is runnable offline.

name: checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # Full history, so the ?v= guard can reach the previously deployed
          # commit. It is cheap without a blob filter now that site/data is out
          # of history — the whole repo is ~1.4 MB.
          #
          # Do NOT add `filter: blob:none` back, and do NOT add `lfs: true`.
          # Together they are broken: git-lfs cannot scan a partial clone for
          # pointers ("Could not scan for Git LFS files"), which failed this
          # job on every push. And neither is needed — check.py reads a pack's
          # hash out of its LFS pointer when the file was never smudged, so the
          # manifest is verified without pulling ~47 MB of objects per run.
          # Whether the runner smudges them or not, the check is the same.
          # pages.yml is where the real bytes must materialise, and it proves
          # they did. See CLAUDE.md, "The packs left git history".
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm

      - name: Install the checkers and the toolchain
        run: |
          python -m pip install --quiet mypy pyflakes
          npm ci

      - name: Work out what was deployed before this push
        id: base
        run: |
          # a push knows its own previous tip; a PR knows its base. A new
          # branch reports all-zeros, and a first commit has no parent — in
          # both cases leave it empty and check.py skips the comparison.
          case "${{ github.event_name }}" in
            pull_request) base="${{ github.event.pull_request.base.sha }}" ;;
            push)         base="${{ github.event.before }}" ;;
            *)            base="" ;;
          esac
          if [ "$base" = "0000000000000000000000000000000000000000" ]; then base=""; fi
          if [ -n "$base" ] && ! git cat-file -e "$base^{commit}" 2>/dev/null; then base=""; fi
          echo "ref=${base:-HEAD}" >> "$GITHUB_OUTPUT"
          echo "comparing against ${base:-HEAD (no previous state — bump guard will skip)}"

      - name: Run the checks
        run: python tools/check.py --base "${{ steps.base.outputs.ref }}"
