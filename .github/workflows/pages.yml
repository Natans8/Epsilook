# Epsilook deploy — publishes docs/ to GitHub Pages.
#
# This workflow exists because the data packs are in Git LFS. Pages does NOT
# resolve LFS pointers, so the old "deploy from a branch" setting would serve
# ~130 bytes of pointer text where data.js expects gzip and break every game
# version. Checking out with `lfs: true` and uploading the result means Pages
# publishes real files and never reads the repo itself.
#
# So this file and .gitattributes are coupled: if the packs ever leave LFS,
# this workflow can go; if this workflow goes, the packs must leave LFS in the
# same change. CLAUDE.md, "The packs left git history", is the long version.
#
# Note the repo setting has to match: Settings -> Pages -> Source must be
# "GitHub Actions", not "Deploy from a branch". Nothing here can set that.

name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# one deploy at a time, and never cancel a half-finished one — a cancelled
# deploy can leave the site serving a partial upload
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
        with:
          lfs: true

      # The served JS is BUILT here, not committed: src/**/*.ts bundles into
      # docs/js/app.js (tools/build.mjs). Note this build does NOT type-check —
      # esbuild strips types without reading them — so a type error alone
      # cannot block a deploy; tsc runs in ci.yml, which stays an alarm
      # (CLAUDE.md, "CI is an alarm"). A genuinely unparseable source or an
      # unreachable module does fail here, because then there is no bundle
      # worth serving.
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm

      - name: Build the bundle
        run: |
          npm ci
          npm run build

      # If the LFS checkout silently no-ops, every pack is a 132-byte pointer
      # and the site would deploy green while serving nothing loadable. That is
      # exactly the invisible failure this repo keeps getting bitten by, so it
      # fails here instead — before the artifact is built.
      - name: Prove the packs are real files, not LFS pointers
        run: |
          set -euo pipefail
          fail=0
          while IFS= read -r -d '' pack; do
            size=$(stat -c%s "$pack")
            if [ "$size" -lt 100000 ]; then
              echo "::error file=$pack::$pack is $size bytes — an unresolved LFS pointer, not a pack"
              fail=1
            else
              echo "ok  $pack  $size bytes"
            fi
          done < <(find docs/data -name '*.gz' -print0)
          if [ ! -s docs/data/versions.json ]; then
            echo "::error::docs/data/versions.json is missing or empty"
            fail=1
          fi
          exit $fail

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - id: deployment
        uses: actions/deploy-pages@v4
