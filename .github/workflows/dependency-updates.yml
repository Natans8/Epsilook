# Is any npm or Python dependency behind its latest release?
#
# THE POINT IS TO STOP A HUMAN HAVING TO REMEMBER, the same reason
# pack-updates.yml exists. `tools/check.py` already warns about this, but it
# only fires when somebody runs it — so a quiet month is a month of nobody
# being told. This asks once a week and opens ONE issue when something is
# behind, editing that same issue on later runs instead of filing a new one.
#
# Both halves of package.json are covered: `npm outdated` reports
# devDependencies alongside dependencies, which is what makes the toolchain —
# esbuild, typescript, oxlint — visible here at all. Most of what this repo
# installs IS a dev dependency. pyproject.toml is covered the same way:
# `uv tree --outdated` reports the dev group beside the build's own
# dependencies, which is where mypy, ruff and pylint live.
#
# It deliberately does NOT bump anything. A major of TypeScript or esbuild can
# change what compiles, and the repo's own checks are the acceptance test, so
# the upgrade wants `uv run python tools/check.py` and a look at the result.
# The issue is the nudge; a human runs the two commands it prints.
name: dependency updates

on:
  schedule:
    # Mondays 06:30 UTC, half an hour after the pack check, so the two never
    # race for the same issue-writing token and their notifications arrive
    # together rather than a week apart.
    - cron: "30 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: false  # the two manifests are all this reads; the packs are not needed

      - uses: actions/setup-node@v7
        with:
          node-version-file: package.json

      # a full version: setup-uv publishes no moving major tag; the
      # interpreter is the requires-python floor, as in ci.yml
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          python-version: "3.14"

      - name: Ask npm and uv which dependencies have a newer release
        id: check
        run: |
          npm install --ignore-scripts --no-audit --no-fund
          # `npm outdated` exits 1 when anything is outdated, which is the right
          # signal for a human running it and the wrong one here: the step must
          # survive so the issue can be filed. `|| true` is deliberate.
          npm outdated --json > outdated.json 2>/dev/null || true
          node --input-type=module -e '
            import {readFileSync, writeFileSync} from "node:fs";
            const pkg = JSON.parse(readFileSync("package.json", "utf8"));
            const dev = new Set(Object.keys(pkg.devDependencies ?? {}));
            let raw = {};
            try { raw = JSON.parse(readFileSync("outdated.json", "utf8") || "{}"); } catch {}
            const behind = Object.entries(raw).filter(([, i]) => i.current !== i.latest);
            const line = ([name, i]) =>
              `  ${name.padEnd(22)} ${String(i.current).padEnd(12)} -> ${String(i.latest).padEnd(12)} ${dev.has(name) ? "(dev)" : ""}`.trimEnd();
            const report = behind.length
              ? [`npm, ${behind.length} behind:`, "", ...behind.sort(([a], [b]) => a.localeCompare(b)).map(line)].join("\n")
              : "every npm dependency is at its latest release";
            writeFileSync("report.txt", report + "\n");
          '
          # The direct Python dependencies only: a transitive one moves when
          # the package that wants it does. The tree drawing is stripped so a
          # line reads like the npm ones above it.
          uv tree --outdated --depth 1 --frozen 2>/dev/null | grep -- "(latest:" | sed -E 's/^[^[:alnum:]]+/  /' > python.txt || true
          if [ -s python.txt ]; then
            printf '\nPython, %s behind:\n\n' "$(wc -l < python.txt)" >> report.txt
            cat python.txt >> report.txt
          else
            printf '\nevery Python dependency is at its latest release\n' >> report.txt
          fi
          # Whether the next CPython can be the interpreter yet: the same
          # sentence check.py prints locally. A blocked one is a line of the
          # report; an installable one opens the issue on its own. No project
          # dependencies are needed to ask, so none are installed for it.
          printf '\n%s\n' "$(uv run --no-project python tools/check.py --python-next 2>&1 || true)" >> report.txt
          cat report.txt
          if grep -qE -- "->|\(latest:|is installable" report.txt; then
            echo "behind=true" >> "$GITHUB_OUTPUT"
          else
            echo "behind=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Open or update the tracking issue
        if: steps.check.outputs.behind == 'true'
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const report = fs.readFileSync('report.txt', 'utf8');
            const title = 'Dependencies are behind their latest releases';
            const body = [
              'At least one dependency in `package.json` or `pyproject.toml` has a newer release, or the next Python has become installable. `(dev)` marks an npm devDependency and `(group: dev)` a Python one — the toolchain, which is most of what this repo installs.',
              '',
              '```',
              report.trim(),
              '```',
              '',
              '### What to do',
              '',
              '1. Update what is worth updating. `npm update` takes the semver-compatible ones; a major needs its version range edited in `package.json` first. `uv lock --upgrade` takes every Python one; then raise its floor in `pyproject.toml` to the version locked.',
              '2. Run the checks — they are the acceptance test, since a new major of TypeScript, esbuild or oxlint can change what compiles or what lints:',
              '',
              '```bash',
              'npm install && uv sync && uv run python tools/check.py',
              '```',
              '',
              '3. Commit each manifest with its lockfile: `package.json` with `package-lock.json`, `pyproject.toml` with `uv.lock`. Pushing is the deploy.',
              '',
              'When the last line of the report says the next Python is installable, raise the floor: `requires-python` and mypy\'s `python_version` in `pyproject.toml`, `py-version` in `.pylintrc`, and every workflow\'s `python-version`, which the `python floor` check holds together; then `uv lock` and the checks. Glimpse and OPie_Emotes share the floor and follow.',
              '',
              '### If it turns out not to be worth doing',
              '',
              'Close the issue with the reason. It is re-raised on the next Monday anything is still behind, so closing is not losing it.',
              '',
              '### You do not have to read this issue to find out',
              '',
              '`uv run python tools/check.py` runs a `dependencies` check that warns with the same information, so a stale dependency surfaces during ordinary work too. This issue is the backstop for a quiet week, not the only signal.',
              '',
              '_Raised by `.github/workflows/dependency-updates.yml`; this issue is edited in place, not reopened._',
            ].join('\n');

            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'dependency-updates',
            });

            if (existing.data.length) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.data[0].number,
                body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ['dependency-updates'],
              });
            }
