[project]
name = "epsilook-build"
version = "0"
description = "The Epsilook data build and the repository checks that run over it."
requires-python = ">=3.12"
dependencies = [
    # The DDL half of reading a mysqldump file. The row scanner is hand-written
    # because nothing on the market reads a dump, but a CREATE TABLE is a real
    # grammar and the column order it yields is what keeps every distilled CSV
    # aligned -- worth a parser rather than a pattern.
    "sqlglot",
]

# Nothing here is installed as a package: the build runs from the checkout and
# the entry points are plain scripts. This file exists so the Python toolchain
# is PINNED rather than ambient -- uv.lock is what makes a checker's version a
# fact of the repository instead of a fact of whoever's machine ran it.
[tool.uv]
package = false

[dependency-groups]
dev = [
    # The exploration database and the tools that read it. Not a build
    # dependency: nothing in the shipped pack path touches DuckDB.
    "duckdb",
    # Columns cross into DuckDB as columns. A pack is already column
    # oriented, so binding it row by row would be the one avoidable cost.
    "pyarrow",
    "mypy",
    "pyflakes",
    "pylint",
    "pytest",
]

[tool.pytest.ini_options]
# Tests live outside the code they cover, as `<module>_test.py` under test/py.
# `pythonpath` puts the package and the test support module on the import path
# without an editable install; `importlib` keeps pytest from rewriting sys.path.
testpaths = ["test/py"]
pythonpath = ["build", "test/py", "tools"]
addopts = "--quiet --no-header --import-mode=importlib"
cache_dir = ".pytest_cache"

# Both caches are pinned to the repository root. Left to their defaults they
# land relative to whatever directory the tool was invoked from, which puts
# generated files inside a source root -- where the IDE indexes them and every
# exclusion has to be maintained twice.
[tool.mypy]
cache_dir = ".mypy_cache"
