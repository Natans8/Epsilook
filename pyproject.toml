[project]
name = "epsilook-build"
version = "0"
description = "The Epsilook data build and the repository checks that run over it."
requires-python = ">=3.12"
dependencies = [
    # The engine behind the SQL table provider, and the exploration database the
    # tools read. One version for both, so a question asked in the mirror and a
    # pack built through `SqlTables` cannot answer it differently.
    "duckdb>=1.5.5",
    # The provider builds its reads as expressions rather than as text: a table
    # and a column name both arrive from a game export, and the one thing a
    # string template cannot promise is that they are quoted as identifiers.
    # `duckdb-engine` is the dialect DuckDB's own documentation names.
    "duckdb-sqlalchemy>=1.5.5",
    "sqlalchemy>=2.0.52",
    # The DDL half of reading a mysqldump file. The row scanner is hand-written
    # because nothing on the market reads a dump, but a CREATE TABLE is a real
    # grammar and the column order it yields is what keeps every distilled CSV
    # aligned -- worth a parser rather than a pattern.
    "sqlglot",
]

# Nothing here is installed as a package: the build runs from the checkout and
# the entry points are plain scripts. This file exists so the Python toolchain
# is PINNED rather than ambient -- uv.lock is what makes a checker's version a
# fact of the repository instead of a fact of whoever's machine ran it.
[tool.uv]
package = false

[dependency-groups]
dev = [
    # Columns cross into DuckDB as columns. A pack is already column
    # oriented, so binding it row by row would be the one avoidable cost.
    "pyarrow",
    # Progress for the tools that take minutes -- a pack sweep, a walk over the
    # client's storage. Declared rather than ambient: it was already imported by
    # a tool the checkers read, so a machine without it failed type checking
    # rather than failing to draw a bar.
    "tqdm",
    "types-tqdm",
    # The formatter, and the only checker here that also writes. Pinned like the
    # rest rather than run through `uvx`, which resolves whatever PyPI served
    # that minute -- the point of this group is that a checker's version is a
    # fact of the repository.
    "ruff",
    "mypy",
    "pyflakes",
    "pylint",
    "pytest",
    # A real Lua inside the test run. The addon's data is written here and read
    # there, and the reader is the one account of that layout -- so the only
    # way to check the two agree is to run the actual reader over an actual
    # chunk. It ships every interpreter as its own module, and the client's is
    # 5.1, so the tests can be exact about the one that matters rather than
    # hoping a newer one behaves the same.
    "lupa",
]

[tool.pytest.ini_options]
# Tests live outside the code they cover, as `<module>_test.py` under test/py.
# `pythonpath` puts the package and the test support module on the import path
# without an editable install; `importlib` keeps pytest from rewriting sys.path.
testpaths = ["test/py"]
pythonpath = ["build", "test/py", "tools"]

# The tests are grouped by what they cover, and one of those groups is called
# `build` -- which is in pytest's own default list of directories not to walk,
# because for most projects it holds artifacts. Left at the default the whole
# group is skipped in silence: collection succeeds, the run is green, and it
# reports a fraction of the tests. Restated here without that entry. Collection
# is scoped by `testpaths` regardless, so this list only has to keep the walk
# out of the things a stray `pytest <path>` could otherwise reach.
norecursedirs = ["*.egg", ".*", "_darcs", "CVS", "dist", "node_modules", "venv"]
addopts = "--quiet --no-header --import-mode=importlib"
cache_dir = ".pytest_cache"

# Formatting was an IDE action before this, which meant it could not run in CI,
# could not run on a machine without PyCharm, and reported success without
# proving a change. `ruff format --check` is a gate check.py can fail on, which
# is what moves the rule out of prose and into something that fires.
#
# The style is black's, unmodified. Every knob ruff exposes was measured against
# this tree first and none of them earned a setting: quote-style preserve moved
# 52 lines of 25,092, skip-magic-trailing-comma moved none, and 100, 160 and 200
# columns reformat exactly the same 181 files as 120 does.
[tool.ruff]
# The width the whole repository wraps at -- .pylintrc, the markdown and the
# TypeScript sources all use it -- so Python is not the one tree carrying its
# own number.
line-length = 120

# Ruff ships as a linter too, and enabling it is a separate call that has not
# been taken: its defaults are 413 rules, they report 172 findings on a tree
# that passes mypy, pyflakes and pylint, and 80 of those are import ordering
# alone. Selecting nothing keeps the editor quiet about rules nothing gates.
[tool.ruff.lint]
select = []

# Both caches are pinned to the repository root. Left to their defaults they
# land relative to whatever directory the tool was invoked from, which puts
# generated files inside a source root -- where the IDE indexes them and every
# exclusion has to be maintained twice.
[tool.mypy]
cache_dir = ".mypy_cache"

# The same three roots pytest puts on the import path, so the checker and the
# runner resolve a module the same way. Without it a tree checked on its own
# cannot see `pack`, and the 150-odd import errors that follow read as if the
# tests were broken rather than as if mypy had been told nothing.
mypy_path = ["build", "test/py", "tools"]

# The floor the package supports, not the interpreter that happens to run the
# checker, so a feature newer than 3.12 is reported here rather than on
# whichever machine is oldest.
python_version = "3.12"

# Strict is the default for every Python tree in this repository. The data
# build and both test trees pass it; what does not yet is named below, and that
# list is meant to shrink.
strict = true

# Not implied by strict. A build full of per-version fallbacks is exactly where
# a branch stops being reachable without anyone noticing.
warn_unreachable = true

# The repository's own scripts, which are not strict yet. Held to mypy's
# defaults, which is where they stood before strict was turned on -- so this
# relaxes nothing that was passing. Every name here is a file in `tools/`, and
# `check_mypy_strict` is what keeps it that way: a build or test module quietly
# added to this list to silence an error would otherwise look exactly like a
# tools module.
[[tool.mypy.overrides]]
module = [
    "addon", "arcanum", "builddb", "bump", "check", "docker_smoke", "dossier",
    "epsilon_names", "epsilon_storage", "epsilon_tables", "epsilon_walks",
    "expansions", "listfile", "mermaid", "packdb", "packfile", "packs",
    "rebuild", "repo", "spellings", "supplement", "verify_live",
]
check_untyped_defs = false
disallow_any_generics = false
disallow_incomplete_defs = false
disallow_subclassing_any = false
disallow_untyped_calls = false
disallow_untyped_decorators = false
disallow_untyped_defs = false
extra_checks = false
no_implicit_reexport = false
strict_equality = false
warn_return_any = false
warn_unreachable = false
# Five `type: ignore` comments in these files are dead -- duckdb became a
# declared dependency, so the import it suppressed now resolves. Removing them
# is a tools change rather than a test one; until then this keeps the tree at
# the behaviour it had before strict was turned on.
warn_unused_ignores = false
