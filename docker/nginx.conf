# Epsilook's server block — dropped into /etc/nginx/conf.d/default.conf, so it
# is included from the stock image's `http` context.
#
# The site is static and the app is one page; almost everything here is about
# getting two things right that GitHub Pages happens to get right for free:
#
#   CACHING. index.html carries a ?v= string that busts the css and the bundle,
#   and versions.json carries a content hash that busts each data pack. Those
#   two files must therefore never be held, and everything they point at can be
#   held forever — a changed asset always arrives under a new URL. Getting this
#   backwards is the failure this repo keeps meeting: new markup served against
#   a cached stylesheet, invisible on the machine that has the new files.
#
#   THE PACKS ARE OPAQUE. site/data/**/*.gz is gzip that data.ts gunzips itself
#   through DecompressionStream. It must go out as a body, never as a gzip
#   Content-Encoding: the browser would decode it a second time and — because
#   Content-Length would then describe the compressed size while the reader
#   counts decoded bytes — the loading meter would run past 100%. nginx will
#   not compress it (application/gzip is not in gzip_types), and `gzip off`
#   below says so out loud rather than relying on that.

# Cache-Control as a map instead of per-location add_header, because add_header
# does NOT inherit: one add_header inside a location silently drops every
# header set on the server. Computing the value here keeps a single add_header
# block at server level, so the security headers cannot be lost by adding a
# location later. nginx tries exact keys first, then the regexes IN ORDER.
map $uri $epsilook_cache {
    # anything unlisted: short, revalidatable. Nothing the app fetches lands
    # here except /404.html's neighbours and dev/oracle.js.
    default                 "public, max-age=300";

    # the two indexes — they are what point at the busted URLs, so holding
    # either one would pin the whole site to an old deploy
    /index.html             "no-cache";
    /404.html               "no-cache";
    /data/versions.json     "no-cache";

    # busted by ?v= in index.html
    ~^/(css|js)/            "public, max-age=31536000, immutable";
    # busted by ?v=<content hash> from versions.json
    ~\.gz$                  "public, max-age=31536000, immutable";
}

server {
    listen      80;
    listen [::]:80;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    # behind Synology's reverse proxy (or any other), a redirect that names the
    # container's own host:port is a dead link
    absolute_redirect off;
    server_tokens off;

    # app.css carries ~370 non-ASCII bytes (the arrows and separators pills are
    # drawn from), and nginx's charset_types default leaves text/css out — so
    # without this the stylesheet's encoding is inherited from whatever
    # referenced it instead of stated. Pages serves it with the charset.
    charset utf-8;
    charset_types text/css text/html text/plain text/xml application/javascript image/svg+xml;

    # One add_header block for the whole server — see the map comment above for
    # why these are not spread across the locations they describe.
    add_header Cache-Control $epsilook_cache always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # No Content-Security-Policy on purpose. The app deliberately hotlinks
    # three third-party origins at runtime — Wowhead's icons and tooltips.js
    # (wow.zamimg.com), wago.tools' CASC API for .blp textures, and the model
    # viewer link-out — so a policy here would be a fourth place that list
    # lives, and it would fail closed and silently the next time one moves.

    gzip              on;
    gzip_vary         on;
    gzip_comp_level   6;
    gzip_min_length   1024;
    gzip_types        text/css text/plain application/javascript application/json
                      application/manifest+json image/svg+xml;

    # The packs. Explicit type because nginx's mime.types does not map .gz on
    # every release, and an application/octet-stream fallback is a download
    # prompt waiting to happen for anyone who opens one directly.
    location ~ \.gz$ {
        types { }
        default_type application/gzip;
        gzip off;
    }

    # site/404.html is written for GitHub Pages, which serves this project at
    # /Epsilook/ and so needs root-absolute URLs — the page is returned for a
    # missing path at ANY depth, where a relative href would resolve against
    # the wrong directory. Mapping that prefix onto the same root means those
    # URLs resolve in the container too, and the 404 page keeps its stylesheet
    # and its "back to the search" link, without a second copy of the file that
    # would drift from the deployed one.
    location ^~ /Epsilook/ {
        rewrite ^/Epsilook/(.*)$ /$1 last;
    }
    location = /Epsilook {
        return 301 /;
    }

    # for the container healthcheck and for whatever is watching the NAS
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location / {
        try_files $uri $uri/ =404;
    }

    error_page 404 /404.html;
}
